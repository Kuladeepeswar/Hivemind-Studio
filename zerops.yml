zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles: ./frontend/dist/~
    run:
      base: static

  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd api && npm install && npm run build
      deployFiles:
        - ./api/dist/~
        - ./api/package.json
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node index.js
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_dbName}
        REDIS_URL: redis://default:${cache_password}@${cache_hostname}:6379
        # NATS_URL is intentionally NOT set here. Service-level variables override
        # project-level ones, so defining it would shadow the project-wide NATS_URL
        # set in the Zerops GUI — which is the one place its real value lives.

  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - cd worker && pip install -r requirements.txt --target .python_packages --break-system-packages
      deployFiles:
        - worker
    run:
      base: python@3.12
      start: python worker/main.py
      envVariables:
        PYTHONPATH: /var/www/worker/.python_packages
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_dbName}
        REDIS_URL: redis://default:${cache_password}@${cache_hostname}:6379
        # NATS_URL is intentionally NOT set here. Service-level variables override
        # project-level ones, so defining it would shadow the project-wide NATS_URL
        # set in the Zerops GUI — which is the one place its real value lives.
        QDRANT_URL: http://${vectors_hostname}:6333
        QDRANT_API_KEY: ${vectors_apiKey}
