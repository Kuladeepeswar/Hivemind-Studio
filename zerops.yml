zerops:
  - setup: web
    build:
      base: nodejs@22
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles: ./frontend/dist/~
    run:
      base: static

  - setup: api
    build:
      base: nodejs@22
      buildCommands:
        - cd api && npm install && npm run build
      deployFiles:
        - ./api/dist/~
        - ./api/package.json
        - ./api/node_modules/~
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node index.js
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_dbName}
        REDIS_URL: redis://${cache_hostname}:6379
        NATS_URL: nats://${queue_hostname}:4222

  - setup: worker
    build:
      base: python@3.12
      buildCommands:
        - cd worker && pip install --upgrade pip
        - cd worker && pip install torch==2.3.1+cpu --index-url https://download.pytorch.org/whl/cpu --target .python_packages --break-system-packages
        - cd worker && pip install --no-cache-dir -r requirements.txt --target .python_packages --break-system-packages
      deployFiles:
        - worker
    run:
      base: python@3.12
      start: python worker/main.py
      envVariables:
        DATABASE_URL: postgresql://${db_user}:${db_password}@${db_hostname}:5432/${db_dbName}
        REDIS_URL: redis://${cache_hostname}:6379
        NATS_URL: nats://${queue_hostname}:4222
        QDRANT_URL: http://${vectors_hostname}:6333
